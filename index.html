<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f0f0d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>Flashcards</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23eceae4'/%3E%3Crect x='7' y='6' width='18' height='20' rx='2' fill='%230f0f0d'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="top">
        <span id="count">—</span>
      </header>

      <button class="card" id="card" type="button" aria-live="polite">
        <p class="label" id="label">question</p>
        <p class="text" id="text"></p>
        <p class="hint" id="hint">tap to reveal</p>
      </button>

      <div class="bottom">
        <button class="next" id="next" type="button">next</button>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
